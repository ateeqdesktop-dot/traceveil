[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "traceveil"
version = "0.1.0"
description = "Local-first, deterministic privacy policy compiler and verifier for OpenTelemetry GenAI telemetry."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ateeq Ghanam" }]
keywords = ["opentelemetry", "genai", "privacy", "telemetry", "security", "observability", "policy-as-code"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["cryptography>=50.0.2,<51"]

[project.urls]
Homepage = "https://github.com/ateeqdesktop-dot/traceveil"
Repository = "https://github.com/ateeqdesktop-dot/traceveil"
Issues = "https://github.com/ateeqdesktop-dot/traceveil/issues"

[project.scripts]
traceveil = "traceveil.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
