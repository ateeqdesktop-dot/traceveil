name: TraceVeil
description: Compile verifiable privacy evidence from OpenTelemetry GenAI telemetry.
branding:
  icon: shield
  color: teal
inputs:
  input:
    description: OTLP JSON input file with resourceSpans.
    required: true
  policy:
    description: Optional TraceVeil TOML policy path.
    required: false
  out:
    description: Sanitized OTLP JSON path.
    required: false
    default: traceveil.sanitized.json
  evidence:
    description: Evidence JSON output path.
    required: false
    default: traceveil.evidence.json
  sarif:
    description: SARIF output path.
    required: false
    default: traceveil.sarif
  junit:
    description: JUnit XML output path.
    required: false
    default: traceveil.junit.xml
  fail-on:
    description: Optional exact severity that should fail the workflow after artifacts are written.
    required: false
runs:
  using: composite
  steps:
    - name: Install TraceVeil
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"
    - name: Sanitize telemetry and compile evidence
      shell: bash
      run: >-
        traceveil sanitize "${{ inputs.input }}"
        ${{ inputs.policy && format('--policy "{0}"', inputs.policy) || '' }}
        --out "${{ inputs.out }}"
        --evidence "${{ inputs.evidence }}"
        --sarif "${{ inputs.sarif }}"
        --junit "${{ inputs.junit }}"
        ${{ inputs.fail-on && format('--fail-on {0}', inputs.fail-on) || '' }}
    - name: Upload SARIF findings
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif }}
outputs:
  sanitized:
    description: Sanitized OTLP JSON path.
    value: ${{ inputs.out }}
  evidence:
    description: Privacy evidence JSON path.
    value: ${{ inputs.evidence }}
