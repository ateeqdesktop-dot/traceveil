name: Bug report
description: Report a reproducible behavior issue without sensitive telemetry.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste credentials, real prompts, PII, or production telemetry. Use a minimal synthetic fixture.
  - type: input
    id: version
    attributes:
      label: TraceVeil version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and safe reproduction
    validations:
      required: true
